<!doctype html>
<html lang="es" data-theme="business">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}{{ system_settings.project_name if system_settings else 'Mesa de Servicio' }}{% endblock %}
    </title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1b1f24">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <!-- Favicon -->
    <link rel="shortcut icon"
        href="{{ url_for('static', filename=system_settings.favicon_path if system_settings else 'favicon.ico') }}">

    <!-- Tailwind CSS + daisyUI -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Sweet Alert2 for notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen bg-gradient-to-br from-gray-900 via-blue-900 to-purple-900">
    <!-- Subtle dots background pattern -->
    <div class="fixed inset-0 opacity-20 pointer-events-none"
        style="background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 20px 20px;">
    </div>

    <!-- Particle canvas for mouse interaction -->
    <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none"></canvas>

    {% block body_content %}
    <!-- Page content goes here -->
    {% endblock %}

    <!-- Socket.IO (for authenticated pages) -->
    {% if current_user and current_user.is_authenticated %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    {% endif %}

    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- Chart.js (if needed) -->
    {% block chart_js %}{% endblock %}

    <!-- SweetAlert2 Handler for Flask Flash Messages -->
    <script>
        const alerts = {{ (get_alerts() if get_alerts else[]) | tojson | safe }};
        if (alerts && alerts.length > 0) {
            alerts.forEach(alert => {
                Swal.fire({
                    icon: alert.category,
                    title: alert.category === 'success' ? '¡Éxito!' :
                        alert.category === 'error' ? 'Error' :
                            alert.category === 'warning' ? 'Advertencia' : 'Información',
                    text: alert.message,
                    confirmButtonText: 'OK',
                    timer: alert.category === 'success' ? 3000 : undefined,
                    timerProgressBar: true
                });
            });
        }
    </script>

    <!-- Particle Canvas Animation -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let mouse = { x: null, y: null };

            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 2 + 1;
                    this.color = `rgba(${Math.random() * 50 + 100}, ${Math.random() * 50 + 100}, 255, ${Math.random() * 0.5})`;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (mouse.x != null) {
                        let dx = mouse.x - this.x;
                        let dy = mouse.y - this.y;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 200) {
                            const forceDirectionX = dx / distance;
                            const forceDirectionY = dy / distance;
                            const force = (200 - distance) / 200;
                            this.vx += forceDirectionX * force * 0.5;
                            this.vy += forceDirectionY * force * 0.5;
                        }
                    }

                    this.vx *= 0.99;
                    this.vy *= 0.99;

                    if (this.x < 0 || this.x > width) this.vx = -this.vx;
                    if (this.y < 0 || this.y > height) this.vy = -this.vy;
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < 100; i++) {
                    particles.push(new Particle());
                }
            }

            initParticles();

            function animate() {
                ctx.fillStyle = 'rgba(17, 24, 39, 0.2)';
                ctx.fillRect(0, 0, width, height);

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>

    {% block extra_scripts %}
    <!-- Page-specific scripts -->
    {% endblock %}
</body>

</html>
