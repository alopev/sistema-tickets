{% extends "layouts/base_layout.html" %}

{% block body_content %}
<!-- daisyUI Drawer Layout (sidebar + main content) -->
<div class="drawer lg:drawer-open">
    <input id="drawer-toggle" type="checkbox" class="drawer-toggle" />

    <!-- Main content area -->
    <div class="drawer-content flex flex-col">
        <!-- Topbar -->
        {% include "components/topbar.html" %}

        <!-- Page content -->
        <main class="flex-1 p-6 relative z-10">
            <div class="max-w-7xl mx-auto">
                {% block content %}
                <!-- Page content goes here -->
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- Sidebar (drawer) -->
    <div class="drawer-side z-50">
        <label for="drawer-toggle" aria-label="close sidebar" class="drawer-overlay"></label>
        {% include "components/sidebar.html" %}
    </div>
</div>

<!-- Floating chat widget (for authenticated users) -->
{% if current_user and current_user.is_authenticated %}
<div id="chat-widget" class="fixed bottom-5 right-5 w-80 z-[1000]">
    <div class="card glass-card">
        <div class="card-body p-0">
            <div class="flex justify-between items-center p-4 bg-primary text-white rounded-t-2xl cursor-pointer hover:bg-primary-focus transition-colors"
                onclick="toggleChatList()">
                <span class="font-semibold">💬 Chat Privado</span>
                <span id="chat-toggle-icon" class="text-2xl font-bold">+</span>
            </div>
            <div id="chat-list-body" class="hidden h-80 overflow-y-auto p-4">
                <h6 class="font-semibold mb-3 text-white">Usuarios Conectados</h6>
                <div id="online-users-list"></div>
            </div>
        </div>
    </div>
</div>

<!-- Container for chat windows -->
<div id="chat-windows-container"></div>

<!-- Initialize chat manager -->
<script>
    {% if current_user %}
    // Initialize chat when the page loads
    document.addEventListener('DOMContentLoaded', function () {
        chatManager.init({{ current_user.id }});
    });
    {% endif %}

    function toggleChatList() {
        const chatListBody = document.getElementById('chat-list-body');
        const toggleIcon = document.getElementById('chat-toggle-icon');

        if (chatListBody.classList.contains('hidden')) {
            chatListBody.classList.remove('hidden');
            toggleIcon.textContent = '-';
        } else {
            chatListBody.classList.add('hidden');
            toggleIcon.textContent = '+';
        }
    }
</script>

<!-- Chat window styles (using Tailwind utilities) -->
<style>
    .chat-window {
        position: fixed;
        width: 350px;
        height: 450px;
        z-index: 999;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        border-radius: 0.5rem;
        overflow: hidden;
    }

    .chat-window-header {
        cursor: move;
    }

    .chat-messages {
        height: 320px;
        overflow-y: auto;
        padding: 10px;
    }
</style>
{% endif %}

{% endblock %}
